<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío | Societa Di Calcio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Diseño premium para la zona de pago */
        .checkout-container { max-width: 500px; margin: 60px auto; padding: 20px; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .checkout-container h1 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.85rem; color: #000; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        .form-group input:focus { border-color: #000; outline: none; }
        .btn-pagar { width: 100%; padding: 16px; background-color: #000; color: #fff; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: background 0.3s; margin-top: 10px; }
        .btn-pagar:hover { background-color: #333; }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Detalles de Envío</h1>
        <form id="checkout-form">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Rubén Hernández">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="calle">Calle, Número y Cruzamientos</label>
                <input type="text" id="calle" required placeholder="Ej. Av. Patria 123, entre X e Y">
            </div>
            <div class="form-group">
                <label for="colonia">Colonia / Fraccionamiento</label>
                <input type="text" id="colonia" required placeholder="Ej. Puerta de Hierro">
            </div>
            <div class="form-group">
                <label for="ciudad">Ciudad y Estado</label>
                <input type="text" id="ciudad" required placeholder="Ej. Zapopan, Jalisco">
            </div>
            <div class="form-group">
                <label for="cp">Código Postal</label>
                <input type="text" id="cp" required placeholder="Ej. 45116">
            </div>
            <button type="submit" class="btn-pagar" id="btn-submit">Proceder al Pago Seguro</button>
        </form>
    </div>

    <script>
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            // 1. Juntar toda la dirección en un solo texto
            const direccionFisica = `${document.getElementById('calle').value}, Col. ${document.getElementById('colonia').value}, ${document.getElementById('ciudad').value}, CP: ${document.getElementById('cp').value}`;

            const cliente = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                direccion: direccionFisica
            };

            // 2. Leer el carrito actual
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            if(carrito.length === 0) {
                alert("Tu carrito está vacío.");
                window.location.href = "index.html";
                return;
            }

            try {
                // 3. Guardar los datos del cliente y su orden en tu base de datos
                await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carrito: carrito, cliente: cliente })
                });

                // 4. Solicitar el enlace de cobro al banco (Mercado Pago)
                const respuestaMP = await fetch('/api/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carrito: carrito })
                });
                
                const datosMP = await respuestaMP.json();

                // 5. Redirigir a la pantalla de la tarjeta
                if(datosMP.success) {
                    window.location.href = datosMP.link_de_pago;
                } else {
                    alert("Error al conectar con la terminal bancaria.");
                    btn.innerText = "Proceder al Pago Seguro";
                    btn.disabled = false;
                }
            } catch(error) {
                console.error("Error:", error);
                alert("Hubo un problema procesando tu orden.");
                btn.innerText = "Proceder al Pago Seguro";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
