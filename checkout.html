<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Seguro | Societa Di Calcio</title>
    <link rel="icon" href="logo-fondo-verde.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="checkout-header">
        <a href="index.html">
            <img src="logo SC sin fondo.png" alt="Societa Di Calcio"> 
        </a>
    </header>

    <div class="checkout-wrapper">
        
        <div class="checkout-form-container">
            <h1>Detalles de Envío</h1>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Rubén Casares">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="calle">Calle y Número </label>
                    <input type="text" id="calle" required placeholder="Ej. Av. Patria 123">
                </div>
                <div class="form-group">
                    <label for="colonia">Colonia / Fraccionamiento</label>
                    <input type="text" id="colonia" required placeholder="Ej. Puerta de Hierro">
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad y Estado</label>
                    <input type="text" id="ciudad" required placeholder="Ej. Zapopan, Jalisco">
                </div>
                <div class="form-group">
                    <label for="cp">Código Postal</label>
                    <input type="text" id="cp" required placeholder="Ej. 45116">
                </div>
                <button type="submit" class="btn-pagar" id="btn-submit">Proceder al Pago</button>
                <p class="secure-note"><i class="fas fa-lock"></i> Tus datos están protegidos y el pago se procesa de forma segura por Mercado Pago.</p>
            </form>
        </div>

        <div class="checkout-summary-container">
            <h2>Resumen de tu Orden</h2>
            <div id="checkout-items-container"></div>
            
            <div class="summary-totals">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío Nacional</span>
                    <span id="checkout-shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total a Pagar</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="checkout-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Societa Di Calcio. Todos los derechos reservados.</p>
            <div class="payment-methods">
                <span class="mp-text">Procesado de forma segura por</span>
                <img src="https://http2.mlstatic.com/frontend-assets/mp-web-navigation/ui-navigation/5.19.5/mercadopago/logo__small.png" alt="Mercado Pago" class="mp-logo">
                <div class="card-icons">
                    <i class="fab fa-cc-visa"></i>
                    <i class="fab fa-cc-mastercard"></i>
                    <i class="fab fa-cc-amex"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="cart.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
