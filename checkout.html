<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Seguro | Societa Di Calcio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ========================================== */
        /* DISEÑO PREMIUM Y SIMÉTRICO                 */
        /* ========================================== */
        
        /* Encabezado: Centrado absoluto con Flexbox */
        .checkout-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid #eaeaea;
            background-color: #fff;
            width: 100%;
        }
        .checkout-header img {
            max-height: 70px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .checkout-wrapper {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            gap: 50px;
            align-items: flex-start;
            min-height: 60vh;
        }

        /* Columna Izquierda: Formulario */
        .checkout-form-container { flex: 1; width: 100%; }
        
        /* Título de Envío: Perfectamente centrado */
        .checkout-form-container h1 { 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 1.5rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.85rem; color: #000; text-transform: uppercase; text-align: left; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        .form-group input:focus { border-color: #000; outline: none; }
        
        .btn-pagar { width: 100%; padding: 16px; background-color: #000; color: #fff; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: background 0.3s; margin-top: 10px; }
        .btn-pagar:hover { background-color: #333; }

        /* Columna Derecha: Resumen de la Orden */
        .checkout-summary-container {
            width: 400px;
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            position: sticky;
            top: 20px;
        }
        .checkout-summary-container h2 { font-size: 1.1rem; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; text-align: center; }
        
        .summary-item { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .summary-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
        
        .summary-totals { margin-top: 25px; border-top: 1px solid #ddd; padding-top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
        .summary-row.total { font-weight: bold; font-size: 1.3rem; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; }

        /* Comportamiento exacto en Celulares */
        @media (max-width: 800px) {
            .checkout-wrapper { 
                flex-direction: column-reverse; 
                margin-top: 10px;
                padding: 15px; /* Da un respiro a los lados en pantallas chicas */
            }
            .checkout-summary-container { 
                width: 100%; 
                box-sizing: border-box; 
                position: static; 
                margin-bottom: 30px;
            }
        }

        /* Estilo para el Footer de Checkout */
        .checkout-footer {
            border-top: 1px solid #eaeaea;
            padding-bottom: 30px;
            background-color: #fff;
            text-align: center; /* Asegura que el footer también esté centrado */
        }
    </style>
</head>
<body>

    <header class="checkout-header">
        <a href="index.html">
            <img src="logo SC sin fondo.png" alt="Societa Di Calcio"> 
        </a>
    </header>

    <div class="checkout-wrapper">
        
        <div class="checkout-form-container">
            <h1>Detalles de Envío</h1>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Rubén Hernández">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="calle">Calle, Número y Cruzamientos</label>
                    <input type="text" id="calle" required placeholder="Ej. Av. Patria 123, entre X e Y">
                </div>
                <div class="form-group">
                    <label for="colonia">Colonia / Fraccionamiento</label>
                    <input type="text" id="colonia" required placeholder="Ej. Puerta de Hierro">
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad y Estado</label>
                    <input type="text" id="ciudad" required placeholder="Ej. Zapopan, Jalisco">
                </div>
                <div class="form-group">
                    <label for="cp">Código Postal</label>
                    <input type="text" id="cp" required placeholder="Ej. 45116">
                </div>
                <button type="submit" class="btn-pagar" id="btn-submit">Proceder al Pago</button>
            </form>
        </div>

        <div class="checkout-summary-container">
            <h2>Resumen de tu Orden</h2>
            <div id="checkout-items-container"></div>
            
            <div class="summary-totals">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío Nacional</span>
                    <span id="checkout-shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total a Pagar</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="checkout-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Societa Di Calcio. Todos los derechos reservados.</p>
            <div class="payment-methods">
                <span class="mp-text">Procesado de forma segura por</span>
                <img src="https://http2.mlstatic.com/frontend-assets/mp-web-navigation/ui-navigation/5.19.5/mercadopago/logo__small.png" alt="Mercado Pago" class="mp-logo">
                <div class="card-icons">
                    <i class="fab fa-cc-visa"></i>
                    <i class="fab fa-cc-mastercard"></i>
                    <i class="fab fa-cc-amex"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="cart.js"></script>
    <script>
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Procesando de forma segura...";
            btn.disabled = true;

            const direccionFisica = `${document.getElementById('calle').value}, Col. ${document.getElementById('colonia').value}, ${document.getElementById('ciudad').value}, CP: ${document.getElementById('cp').value}`;

            const cliente = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                direccion: direccionFisica
            };

            const carrito = JSON.parse(localStorage.getItem('shoppingCart')) || [];
            if(carrito.length === 0) {
                alert("Tu carrito está vacío.");
                window.location.href = "index.html";
                return;
            }

            try {
                await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carrito: carrito, cliente: cliente })
                });

                const respuestaMP = await fetch('/api/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carrito: carrito })
                });
                
                const datosMP = await respuestaMP.json();

                if(datosMP.success) {
                    window.location.href = datosMP.link_de_pago; 
                } else {
                    alert("Error al conectar con la terminal bancaria.");
                    btn.innerText = "Proceder al Pago";
                    btn.disabled = false;
                }
            } catch(error) {
                console.error("Error:", error);
                alert("Hubo un problema procesando tu orden.");
                btn.innerText = "Proceder al Pago";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
