<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Societa Di Calcio</title>
    <link rel="icon" href="logo-fondo-verde.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <a href="index.html"><img src="logo SC sin fondo.png" width="150" alt="Logo de la Marca"></a>
        </div>
        <nav class="main-nav">
            <a href="index.html#novedades">Novedades</a>
            <a href="index.html#colecciones">Colecciones</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>
        <div class="cart-icon">
            <a href="carrito.html">🛒 Carrito (0)</a>
        </div>
    </header>

    <main class="cart-page-main">
        <section class="cart-section">
            <h1>Tu Carrito de Compras</h1>
            <div class="cart-layout">
                <div class="cart-items-container">
                    </div>

                <div class="cart-summary">
                    <h2>Resumen de la Orden</h2>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Envío</span>
                        <span>$100.00</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="summary-total">$0.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-checkout" style="text-align: center;display: block; ">Proceder al Pago</a>
                </div>
            </div>
        </section>
    </main>

    <script src="cart.js"></script>
    <script>
        // Carga los items en la página del carrito cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            loadCartItems();
        });
    </script>
</body>
</html>
