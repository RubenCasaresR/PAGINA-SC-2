<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Societa Di Calcio</title>
    <link rel="icon" href="logo-fondo-verde.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f4; padding: 40px; }
        .admin-container { background-color: white; max-width: 850px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .stock-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .btn-guardar { background-color: #000; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        .btn-guardar:hover { background-color: #333; }
        .btn-eliminar { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s;}
        .btn-eliminar:hover { background-color: #c82333; }
        .btn-actualizar { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; margin-right: 5px;}
        .btn-actualizar:hover { background-color: #0056b3; }
        .mensaje { display: none; padding: 10px; margin-top: 15px; text-align: center; border-radius: 4px; font-weight: bold; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        hr { margin: 40px 0; border: none; border-top: 2px dashed #ccc; }
        .talla-input { width: 50px !important; padding: 5px !important; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .img-input { width: 100% !important; padding: 8px !important; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace;}
        
        /* Estilo para el botón de Excel */
        .btn-excel { background-color: #28a745; color: white; padding: 12px 20px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%; font-size: 16px; transition: background 0.3s;}
        .btn-excel:hover { background-color: #218838; }

        /* Estilo para la pantalla de acceso */
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-box { background-color: white; max-width: 400px; width: 100%; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .login-box h1 { font-size: 22px; margin-bottom: 10px; }
        .login-box p { color: #777; margin-bottom: 25px; font-size: 14px; }
        .btn-logout { width: auto; padding: 8px 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen" style="display:none;">
        <div class="login-box">
            <h1>🔐 Acceso Restringido</h1>
            <p>Panel de administración de Società Di Calcio</p>
            <div class="form-group">
                <label>Contraseña de Administrador</label>
                <input type="password" id="login-password" autocomplete="current-password">
            </div>
            <button class="btn-guardar" id="btn-login" style="margin-top: 10px;">Entrar al Panel</button>
            <div id="login-error" class="mensaje"></div>
        </div>
    </div>

    <div class="admin-container" id="admin-panel" style="display:none;">
        <div style="text-align: right; margin-bottom: 20px;">
            <button class="btn-eliminar btn-logout" id="btn-logout">🚪 Cerrar Sesión</button>
        </div>
        <h1>⚙️ Ingreso de Nueva Mercancía</h1>
        <form id="form-nuevo-producto">
            <div class="form-group">
                <label>ID del Producto (Sin espacios, ej: playera-visitante):</label>
                <input type="text" id="prod-id" required>
            </div>
            <div class="form-group">
                <label>Nombre de la Playera:</label>
                <input type="text" id="prod-nombre" required>
            </div>
            <div class="form-group">
                <label>Precio ($):</label>
                <input type="number" id="prod-precio" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Nombre de la Imagen Principal (ej: foto1.png):</label>
                <input type="text" id="prod-imagen" required>
            </div>
            <div class="form-group">
                <label>Descripción:</label>
                <textarea id="prod-desc" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Inventario Inicial (Piezas por Talla):</label>
                <div class="stock-grid">
                    <div><label>XS:</label><input type="number" id="stock-xs" value="0" min="0"></div>
                    <div><label>S:</label><input type="number" id="stock-s" value="0" min="0"></div>
                    <div><label>M:</label><input type="number" id="stock-m" value="0" min="0"></div>
                    <div><label>L:</label><input type="number" id="stock-l" value="0" min="0"></div>
                    <div><label>XL:</label><input type="number" id="stock-xl" value="0" min="0"></div>
                </div>
            </div>
            <button type="submit" class="btn-guardar">Guardar Producto en Bodega</button>
        </form>
        <div id="mensaje-alerta" class="mensaje"></div>

        <hr>

        <h1>👕 Inventario Actual</h1>
        <div id="lista-inventario" style="margin-top: 20px;">
            <p style="text-align: center; color: #777;">Cargando inventario...</p>
        </div>

        <hr>

        <h1>💌 Base de Datos de Clientes</h1>
        <button id="btn-descargar-correos" class="btn-excel">
            <i class="fas fa-file-excel"></i> Descargar Correos en Excel
        </button>

        <hr>
        
        <h1>📦 Registro de Ventas</h1>
        <div id="lista-ordenes" style="margin-top: 20px;">
            <p style="text-align: center; color: #777;">Cargando ventas...</p>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById('login-screen');
        const adminPanel = document.getElementById('admin-panel');
        const loginError = document.getElementById('login-error');

        function mostrarLogin() {
            if (loginScreen) loginScreen.style.display = 'flex';
            if (adminPanel) adminPanel.style.display = 'none';
        }

        function mostrarPanel() {
            if (loginScreen) loginScreen.style.display = 'none';
            if (adminPanel) adminPanel.style.display = 'block';
            cargarInventario();
            cargarVentas();
        }

        // Al cargar la página, preguntamos al servidor si ya hay sesión activa
        (async function verificarSesion() {
            try {
                const respuesta = await fetch('/api/admin/verificar');
                const datos = await respuesta.json();
                if (datos.autenticado) mostrarPanel();
                else mostrarLogin();
            } catch (error) {
                mostrarLogin();
            }
        })();

        // Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            const password = document.getElementById('login-password').value;
            loginError.style.display = 'none';
            try {
                const respuesta = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const datos = await respuesta.json();
                if (datos.success) {
                    mostrarPanel();
                } else {
                    loginError.style.display = 'block';
                    loginError.className = 'mensaje';
                    loginError.style.backgroundColor = '#f8d7da';
                    loginError.style.color = '#721c24';
                    loginError.innerText = '🔒 ' + (datos.error || 'Contraseña incorrecta.');
                }
            } catch (error) {
                loginError.style.display = 'block';
                loginError.style.backgroundColor = '#f8d7da';
                loginError.style.color = '#721c24';
                loginError.innerText = 'Error de conexión con el servidor.';
            }
        });

        document.getElementById('login-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await fetch('/api/admin/logout', { method: 'POST' });
            } catch (error) {}
            mostrarLogin();
        });

        // 1. LÓGICA PARA AGREGAR PRODUCTO
        document.getElementById('form-nuevo-producto').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const nuevoProducto = {
                id: document.getElementById('prod-id').value,
                nombre: document.getElementById('prod-nombre').value,
                precio: parseFloat(document.getElementById('prod-precio').value),
                imagen: document.getElementById('prod-imagen').value,
                descripcion: document.getElementById('prod-desc').value,
                stock: {
                    'XS': parseInt(document.getElementById('stock-xs').value),
                    'S': parseInt(document.getElementById('stock-s').value),
                    'M': parseInt(document.getElementById('stock-m').value),
                    'L': parseInt(document.getElementById('stock-l').value),
                    'XL': parseInt(document.getElementById('stock-xl').value)
                }
            };

            try {
                const respuesta = await fetch('/api/admin/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });
                const resultado = await respuesta.json();
                const mensajeDiv = document.getElementById('mensaje-alerta');
                mensajeDiv.style.display = 'block';
                
                if (resultado.success) {
                    mensajeDiv.className = 'mensaje exito';
                    mensajeDiv.innerText = "✅ ¡Producto agregado a la tienda exitosamente!";
                    document.getElementById('form-nuevo-producto').reset(); 
                    cargarInventario(); 
                } else {
                    mensajeDiv.style.backgroundColor = '#f8d7da';
                    mensajeDiv.style.color = '#721c24';
                    mensajeDiv.innerText = "🚨 Error: " + resultado.error;
                }
            } catch (error) {
                console.error("Error de conexión:", error);
            }
        });

        // 2. LÓGICA PARA CARGAR EL INVENTARIO 
        async function cargarInventario() {
            try {
                const respuesta = await fetch('/api/productos');
                const productos = await respuesta.json();
                const contenedor = document.getElementById('lista-inventario');

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p style="text-align: center;">Tu bodega está vacía.</p>';
                    return;
                }

                let htmlInventario = '';
                productos.forEach(prod => {
                    const xsStock = prod.stock['XS'] || 0;
                    const sStock = prod.stock['S'] || 0;
                    const mStock = prod.stock['M'] || 0;
                    const lStock = prod.stock['L'] || 0;
                    const xlStock = prod.stock['XL'] || 0;

                    const fotosActuales = prod.imagenes ? prod.imagenes.join(', ') : '';

                    htmlInventario += `
                    <div style="background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #000; display: flex; flex-direction: column; gap: 10px;">
                        
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong style="font-size: 1.1rem;">${prod.nombre}</strong> <span style="color: #888; font-size: 0.9em;">(ID: ${prod.id})</span><br>
                                <div style="display: flex; align-items: center; margin-top: 5px;">
                                    <span style="color: #28a745; font-weight: bold; margin-right: 5px;">$</span>
                                    <input type="number" id="edit-precio-${prod.id}" value="${prod.precio}" step="0.01" style="width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; color: #28a745;">
                                </div>
                            </div>
                            <div>
                                <button class="btn-actualizar" onclick="guardarCambiosProducto('${prod.id}')">💾 Guardar Cambios</button>
                                <button class="btn-eliminar" onclick="eliminarProducto('${prod.id}')">🗑️ Eliminar</button>
                            </div>
                        </div>

                        <div style="background: #eee; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px;">
                            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                                <strong>Inventario:</strong>
                                <label>XS: <input type="number" id="edit-xs-${prod.id}" class="talla-input" value="${xsStock}" min="0"></label>
                                <label>S: <input type="number" id="edit-s-${prod.id}" class="talla-input" value="${sStock}" min="0"></label>
                                <label>M: <input type="number" id="edit-m-${prod.id}" class="talla-input" value="${mStock}" min="0"></label>
                                <label>L: <input type="number" id="edit-l-${prod.id}" class="talla-input" value="${lStock}" min="0"></label>
                                <label>XL: <input type="number" id="edit-xl-${prod.id}" class="talla-input" value="${xlStock}" min="0"></label>
                            </div>
                            
                            <div style="border-top: 1px dashed #ccc; padding-top: 10px;">
                                <strong>📸 Imágenes (Separadas por comas):</strong>
                                <input type="text" id="edit-img-${prod.id}" class="img-input" value="${fotosActuales}" placeholder="ej: foto-frente.png, foto-atras.png">
                            </div>
                        </div>

                    </div>`;
                });
                contenedor.innerHTML = htmlInventario;
            } catch (error) {
                console.error("Error cargando inventario:", error);
            }
        }

        // 3. LÓGICA: GUARDAR STOCK, IMÁGENES Y PRECIO
        async function guardarCambiosProducto(idProducto) {
            const nuevoPrecio = parseFloat(document.getElementById(`edit-precio-${idProducto}`).value);
            
            const nuevoStock = {
                'XS': parseInt(document.getElementById(`edit-xs-${idProducto}`).value) || 0,
                'S': parseInt(document.getElementById(`edit-s-${idProducto}`).value) || 0,
                'M': parseInt(document.getElementById(`edit-m-${idProducto}`).value) || 0,
                'L': parseInt(document.getElementById(`edit-l-${idProducto}`).value) || 0,
                'XL': parseInt(document.getElementById(`edit-xl-${idProducto}`).value) || 0
            };

            const nuevasFotos = document.getElementById(`edit-img-${idProducto}`).value;

            try {
                const respuesta = await fetch(`/api/admin/productos/${idProducto}/actualizar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ precio: nuevoPrecio, stock: nuevoStock, imagenes: nuevasFotos })
                });
                
                const resultado = await respuesta.json();

                if (resultado.success) {
                    alert("✅ " + resultado.message);
                } else {
                    alert("❌ Error: " + resultado.error);
                }
            } catch (error) {
                console.error("🚨 Error de conexión:", error);
                alert("Hubo un problema al contactar con la bodega.");
            }
        }

        // 4. LÓGICA PARA ELIMINAR 
        async function eliminarProducto(idDelProducto) {
            const confirmacion = confirm("¿Estás seguro de que quieres eliminar este producto?");
            if (confirmacion) {
                try {
                    const respuesta = await fetch(`/api/admin/productos/${idDelProducto}`, { method: 'DELETE' });
                    const resultado = await respuesta.json();
                    if (resultado.success) {
                        alert("✅ " + resultado.message);
                        cargarInventario(); 
                    } else {
                        alert("❌ Error: " + resultado.error);
                    }
                } catch (error) {
                    console.error("🚨 Error de conexión:", error);
                }
            }
        }

        // 5. LÓGICA PARA VER LAS VENTAS 
        function escaparHTMLAdmin(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function etiquetaEstado(estado) {
            const colores = {
                pagado: '#28a745',
                pendiente: '#f0ad4e',
                rechazado: '#d9534f'
            };
            const texto = ['pagado', 'pendiente', 'rechazado'].includes(estado) ? estado : 'sin pago';
            const color = colores[texto] || '#999';
            return `<span style="background: ${color}; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; text-transform: uppercase;">${texto}</span>`;
        }

        async function cargarVentas() {
            try {
                const respuesta = await fetch('/api/admin/ordenes');
                const ventas = await respuesta.json();
                const contenedor = document.getElementById('lista-ordenes');

                if (ventas.length === 0) {
                    contenedor.innerHTML = '<p style="text-align: center;">Aún no hay ventas registradas.</p>';
                    return;
                }

                let htmlVentas = '';
                ventas.forEach(venta => {
                    let listaArticulos = '';
                    venta.productos.forEach(item => {
                        listaArticulos += `<li style="margin-bottom: 5px;"><strong>${item.quantity}x</strong> ${escaparHTMLAdmin(item.name)} (Talla: ${escaparHTMLAdmin(item.size)}) - $${(item.price * item.quantity).toFixed(2)}</li>`;
                    });

                    htmlVentas += `
                    <div style="background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; border-left: 5px solid #28a745; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
                            <strong style="font-size: 1.1rem;">Orden #${venta.id}</strong>
                            <div style="text-align: right;">
                                ${etiquetaEstado(venta.estado)}
                                <span style="color: #666; display: block; margin-top: 4px;">${new Date(venta.fecha).toLocaleString()}</span>
                            </div>
                        </div>
                        <p style="margin: 5px 0;"><strong>👤 Cliente:</strong> ${escaparHTMLAdmin(venta.nombre)} (${escaparHTMLAdmin(venta.email)})</p>
                        <p style="margin: 5px 0;"><strong>📍 Dirección:</strong> ${escaparHTMLAdmin(venta.direccion)}</p>
                        <p style="margin: 5px 0; color: #28a745;"><strong>💰 Total: $${venta.total.toFixed(2)}</strong></p>
                        <div style="margin-top: 15px; background: #f9f9f9; padding: 10px;">
                            <ul style="margin: 0;">${listaArticulos}</ul>
                        </div>
                    </div>`;
                });
                contenedor.innerHTML = htmlVentas;
            } catch (error) {
                console.error("Error cargando ventas:", error);
            }
        }

        // ========================================== //
        // ====== DESCARGAR EXCEL DE CORREOS ======== //
        // ========================================== //
        const btnDescargarCorreos = document.getElementById('btn-descargar-correos');

        if (btnDescargarCorreos) {
            btnDescargarCorreos.addEventListener('click', () => {
                // Redirigimos al servidor para que nos entregue el archivo (evita cualquier bloqueo)
                window.location.href = '/api/admin/descargar-csv?hora=' + Date.now();
            });
        }

        // Ejecutar las funciones al cargar la página (Las pantallas las decide el servidor)
    </script>
</body>
</html>
